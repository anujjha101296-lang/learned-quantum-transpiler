name: Quantum Transpiler CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  qiskit-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Validate saved experiment data
        run: |
          python - <<'PY'
          import json
          for p in ("arm_table.json", "results.json", "budget_results.json"):
              with open(p, encoding="utf-8") as f:
                  json.load(f)
          print("Saved JSON experiment artifacts parse successfully")
          PY
      - name: Run minimal Qiskit transpilation
        run: |
          python - <<'PY'
          import numpy as np
          from qiskit import QuantumCircuit, transpile
          from qiskit.quantum_info import Operator
          from qiskit.transpiler import CouplingMap
          from bandit_transpile import ghz, qft_c, qaoa_ring
          circuits = [
              ("ghz4", ghz(4)),
              ("qft4", qft_c(4).decompose(reps=10)),
              ("qaoa4", qaoa_ring(4, 1, np.random.default_rng(11))),
          ]
          for name, qc in circuits:
              # Basis translation without a physical layout keeps logical wire
              # ordering canonical for an exact full-unitary comparison.
              out = transpile(qc, basis_gates=["cx", "rz", "sx", "x"],
                              optimization_level=2, seed_transpiler=7)
              assert out.num_qubits == qc.num_qubits, (name, out.num_qubits)
              assert out.depth() > 0
              assert Operator(qc).equiv(Operator(out)), f"{name}: transpilation changed unitary"
              assert set(out.count_ops()).issubset({"cx", "rz", "sx", "x", "barrier"})
              # Separately check placement against the actual 4x4 benchmark topology.
              grid_out = transpile(qc, coupling_map=CouplingMap.from_grid(4, 4),
                                   basis_gates=["cx", "rz", "sx", "x"],
                                   optimization_level=2, seed_transpiler=7)
              assert grid_out.num_qubits == 16 and grid_out.depth() > 0
              assert set(grid_out.count_ops()).issubset({"cx", "rz", "sx", "x", "barrier"})
              print(name, "line-unitary + 4x4-grid mapping PASS", out.count_ops(), grid_out.count_ops())
          PY
